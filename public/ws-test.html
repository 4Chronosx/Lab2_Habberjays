<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Test Client</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 2rem;
        line-height: 1.6;
        background: #fafafa;
        color: #333;
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      .status {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }

      .status.connected {
        background: #d4edda;
        color: #155724;
      }

      .status.disconnected {
        background: #f8d7da;
        color: #721c24;
      }

      .status.error {
        background: #fff3cd;
        color: #856404;
      }

      .panel {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      .panel h2 {
        font-size: 1rem;
        margin-bottom: 0.75rem;
        color: #555;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.25rem;
        font-size: 0.9rem;
      }

      select,
      input,
      textarea {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.95rem;
        font-family: inherit;
        margin-bottom: 0.75rem;
      }

      textarea {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        resize: vertical;
        min-height: 60px;
      }

      button {
        padding: 0.5rem 1.25rem;
        font-size: 0.95rem;
        border: 1px solid #333;
        border-radius: 4px;
        background: #f9f9f9;
        cursor: pointer;
        margin-right: 0.5rem;
      }

      button:hover {
        background: #eaeaea;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: #0d6efd;
        color: #fff;
        border-color: #0d6efd;
      }

      .btn-primary:hover {
        background: #0b5ed7;
      }

      .btn-secondary {
        background: #6c757d;
        color: #fff;
        border-color: #6c757d;
      }

      .btn-secondary:hover {
        background: #5c636a;
      }

      #log {
        background: #1e1e1e;
        color: #d4d4d4;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.85rem;
        padding: 1rem;
        border-radius: 4px;
        height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .log-entry {
        margin-bottom: 0.25rem;
      }

      .log-time {
        color: #6a9955;
      }

      .log-info {
        color: #569cd6;
      }

      .log-error {
        color: #f44747;
      }

      .log-msg {
        color: #dcdcaa;
      }

      .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Test Client</h1>
    <div id="status" class="status disconnected">Disconnected</div>

    <div class="panel">
      <h2>Send Message</h2>
      <label for="type">Message Type</label>
      <select id="type">
        <option value="debug:ping">debug:ping</option>
        <option value="task:created">task:created</option>
        <option value="task:updated">task:updated</option>
        <option value="task:deleted">task:deleted</option>
        <option value="debug:unknown">debug:unknown (expect error)</option>
      </select>

      <label for="payload">Payload (JSON)</label>
      <textarea id="payload">{}</textarea>

      <div class="actions">
        <button id="send" class="btn-primary" disabled>Send</button>
        <button id="send-ping" class="btn-secondary" disabled>
          Send debug:ping
        </button>
        <button id="open-second" class="btn-secondary">
          Open Second Client
        </button>
        <button id="clear-log">Clear Log</button>
      </div>
    </div>

    <div class="panel">
      <h2>Message Log</h2>
      <div id="log"></div>
    </div>

    <script>
      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const sendBtn = document.getElementById("send");
      const typeSelect = document.getElementById("type");
      const payloadInput = document.getElementById("payload");
      const sendPingBtn = document.getElementById("send-ping");
      const openSecondBtn = document.getElementById("open-second");
      const clearLogBtn = document.getElementById("clear-log");

      let ws = null;
      const sampleTaskId = "00000000-0000-0000-0000-000000000001";

      const payloadTemplates = {
        "debug:ping": {},
        "task:created": {
          id: sampleTaskId,
          title: "Client-side sample task",
          description: "Sample payload for test page",
          current_status: "todo",
        },
        "task:updated": {
          id: sampleTaskId,
          title: "Updated title sample",
          current_status: "in-progress",
        },
        "task:deleted": {
          id: sampleTaskId,
        },
        "debug:unknown": {
          note: "Server should reply with unsupported debug message error",
        },
      };

      function getTimestamp() {
        return new Date().toLocaleTimeString("en-US", { hour12: false });
      }

      function appendLog(text, className) {
        const entry = document.createElement("div");
        entry.className = "log-entry";

        const time = document.createElement("span");
        time.className = "log-time";
        time.textContent = "[" + getTimestamp() + "] ";

        const msg = document.createElement("span");
        msg.className = className || "log-info";
        msg.textContent = text;

        entry.appendChild(time);
        entry.appendChild(msg);
        logEl.appendChild(entry);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(text, state) {
        statusEl.textContent = text;
        statusEl.className = "status " + state;
      }

      function connect() {
        // Extract token from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        if (!token) {
          appendLog(
            "Error: No token provided in URL query parameter (?token=...)",
            "log-error",
          );
          setStatus("Error: Missing token", "error");
          return;
        }

        // Server is running on localhost:8000, so connect the WebSocket directly there.
        const url = "ws://localhost:8000/?token=" + encodeURIComponent(token);

        appendLog("Connecting to " + url + "...", "log-info");
        ws = new WebSocket(url);

        ws.addEventListener("open", function () {
          setStatus("Connected", "connected");
          sendBtn.disabled = false;
          sendPingBtn.disabled = false;
          appendLog("Connected to server", "log-info");
          console.log("[WS] Connected to server");
        });

        ws.addEventListener("message", function (event) {
          let display;
          try {
            const parsed = JSON.parse(event.data);
            display = JSON.stringify(parsed, null, 2);
          } catch {
            display = event.data;
          }
          appendLog("Received: " + display, "log-msg");
          console.log("[WS] Message received:", event.data);
        });

        ws.addEventListener("close", function (event) {
          setStatus("Disconnected", "disconnected");
          sendBtn.disabled = true;
          sendPingBtn.disabled = true;
          appendLog(
            "Connection closed (code=" + event.code + ", reason=" + event.reason + ")",
            "log-error",
          );
          console.log("[WS] Connection closed", event.code, event.reason);
        });

        ws.addEventListener("error", function () {
          setStatus("Error", "error");
          sendBtn.disabled = true;
          sendPingBtn.disabled = true;
          appendLog("Connection error", "log-error");
          console.log("[WS] Connection error");
        });
      }

      function sendMessage(type, payload) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        const message = {
          type: type,
          payload: payload,
          timestamp: new Date().toISOString(),
        };

        const serialized = JSON.stringify(message);
        ws.send(serialized);
        appendLog("Sent: " + JSON.stringify(message, null, 2), "log-info");
      }

      function setPayloadTemplate(type) {
        const template = payloadTemplates[type] ?? {};
        payloadInput.value = JSON.stringify(template, null, 2);
      }

      typeSelect.addEventListener("change", function () {
        setPayloadTemplate(typeSelect.value);
      });

      sendBtn.addEventListener("click", function () {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        if (typeSelect.value.startsWith("task:")) {
          appendLog(
            "Info: task events are not client-to-server on this endpoint. Use REST /tasks for create/update/delete; WebSocket receives broadcasts.",
            "log-error",
          );
          return;
        }

        let payload;
        try {
          payload = JSON.parse(payloadInput.value);
        } catch {
          appendLog("Error: Payload is not valid JSON", "log-error");
          return;
        }

        sendMessage(typeSelect.value, payload);
      });

      sendPingBtn.addEventListener("click", function () {
        sendMessage("debug:ping", {});
      });

      openSecondBtn.addEventListener("click", function () {
        window.open(location.href, "_blank", "width=800,height=700");
      });

      clearLogBtn.addEventListener("click", function () {
        logEl.innerHTML = "";
      });

      setPayloadTemplate(typeSelect.value);
      connect();
    </script>
  </body>
</html>
